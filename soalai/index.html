// ===== DATA LAYER =====
const DUMMY={id:'demo-1',judul:'Contoh: Ekosistem (Demo)',mapel:'IPA',kelas:'7',topik:'Ekosistem',model:'demo',created_at:new Date().toISOString(),questions:[

const DB={
 async sets(){if(IS_PREVIEW)return S.sets;const{data}=await sb.from('question_sets').select('*,questions(*)').order('created_at',{ascending:false});return(data||[]).map(s=>({...s,questions:(s.questions||[]).sort((a,b)=>a.no-b.no)}))},
 async save(set){if(IS_PREVIEW){S.sets.unshift(set);return set}
  const{questions,id,...h}=set;const{data,error}=await sb.from('question_sets').insert(h).select().single();if(error)throw error;
  const{error:e2}=await sb.from('questions').insert(questions.map((q,i)=>({set_id:data.id,no:i+1,tipe:q.tipe,level:q.level,stimulus:q.stimulus||null,soal:q.soal,opsi:q.opsi??null,kunci:q.kunci??null,pembahasan:q.pembahasan||'',poin:q.poin||1,tp:q.tp||null,indikator:q.indikator||null})));if(e2)throw e2;
  return{...data,questions}},
 async del(id){if(!IS_PREVIEW)await sb.from('question_sets').delete().eq('id',id);S.sets=S.sets.filter(s=>s.id!=id)},
 async log(l){S.log.unshift({...l,created_at:new Date().toISOString()});if(!IS_PREVIEW)await sb.from('generation_logs').insert(l)},

};
async function autoSetupDatabase(){
 if(IS_PREVIEW){if(!S.sets.length)S.sets.push(DUMMY);return} // data dummy hanya di mode preview, tidak masuk Supabase
 const{error}=await sb.from('question_sets').select('id').limit(1);
 if(error)toast('Tabel belum ada: jalankan SQL setup di Supabase SQL Editor.')}

// ===== GEMINI (multi key + model otomatis + paralel) =====
const API='https://generativelanguage.googleapis.com/v1beta/';
const kid=k=>k.l+'|'+k.v.slice(-6),kst=()=>ls('kst',{}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mark=(k,p)=>{const s=kst();s[kid(k)]={...(s[kid(k)]||{}),...p};sv('kst',s)};
const rank=m=>(/pro/.test(m)?0:/lite/.test(m)?3:/flash/.test(m)?1:4)*10-(parseFloat((m.match(/(\d+(\.\d+)?)/)||[0])[0])||0)+(/preview|exp/.test(m)?5:0);
const usable=m=>{const s=kst(),n=Date.now();return ls('keys',[]).filter(k=>!s[kid(k)]?.bad&&(!m||(S.cd[kid(k)+'|'+m]||0)<n))};
async function fetchModels(k){const r=await fetch(API+'models?pageSize=200',{headers:{'x-goog-api-key':k.v}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(j.error?.message||r.status),{st:r.status});
 return j.models.filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')&&/gemini/.test(x.name)&&!/image|tts|live|embed|audio|robotics|omni|cyber|nano|computer|learnlm|gemma/.test(x.name)).map(x=>x.name.replace('models/','')).sort((a,b)=>rank(a)-rank(b))}
async function testKeys(){
 const ks=ls('keys',[]);if(!ks.length)return toast('Tambahkan API key dulu');toast('Menguji semua key...');const all=new Set();let ok=0;
 for(const k of ks){try{(await fetchModels(k)).forEach(m=>all.add(m));mark(k,{bad:false,ok:true});ok++}catch(e){mark(k,{ok:false,bad:e.st==400||e.st==403,err:String(e.message).slice(0,80)})}}
 sv('models',[...all].sort((a,b)=>rank(a)-rank(b)));S.badm=new Set();S.cd={};toast(`${ok}/${ks.length} key aktif, ${all.size} model tersedia`);A.go('set')}
async function call(prompt){
 let err=Error('Tidak ada API key yang bisa dipakai (limit/tidak valid). Tunggu sebentar atau tambah key.');
 let models=ls('models',[]);const sel=ls('model','auto');
 if(!models.length){const k=usable()[0];if(k)try{models=await fetchModels(k);sv('models',models)}catch{}}
 const cand=[...new Set([...(sel!='auto'?[sel]:[]),...models.slice(0,10),ls('fallback','gemini-flash-latest'),'gemini-flash-latest'])].filter(Boolean);
 for(let round=0;round<2;round++){
  for(const m of cand){if(S.badm.has(m))continue;const ks=usable(m),o=S.ki++;
   for(let i=0;i<ks.length;i++){const k=ks[(o+i)%ks.length],id=kid(k),t=Date.now();if((S.cd[id+'|'+m]||0)>Date.now())continue;
    try{const r=await fetch(API+`models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.v},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.7}})});
     const j=await r.json().catch(()=>({}));
     if(!r.ok){const msg=String(j.error?.message||r.status);throw Object.assign(Error(r.status+' '+msg.slice(0,120)),{st:r.status,msg})}
     const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!txt)throw Object.assign(Error('Respons kosong/terblokir'),{st:-1,msg:''});
     mark(k,{ok:true,bad:false});DB.log({model:m,key_label:k.l,status:'ok',error:null,durasi_ms:Date.now()-t,set_title:'chunk'});return{txt,m}
    }catch(e){err=e;const g=e.msg||'';DB.log({model:m,key_label:k.l,status:'gagal',error:String(e.message).slice(0,200),durasi_ms:Date.now()-t,set_title:'chunk'});
     if(e.st==404||(e.st==400&&/model|not supported|not found/i.test(g)&&!/API key/i.test(g))){S.badm.add(m);break}
     if(/API key not valid|API_KEY_INVALID|suspended|leaked|disabled|expired/i.test(g)){mark(k,{bad:true,ok:false,err:g.slice(0,80)});continue}
     if(e.st==429){const d=/limit:\s*0/i.test(g)?216e5:/PerDay|per day/i.test(g)?36e5:(+(g.match(/retry in ([\d.]+)s/i)||[])[1]||30)*1000;S.cd[id+'|'+m]=Date.now()+d+500;continue}
     if(e.st==403){S.cd[id+'|'+m]=Date.now()+36e5;continue}
     S.cd[id+'|'+m]=Date.now()+(e.st>=500?10e3:2e3)}}}
  const w=Math.min(...Object.values(S.cd).filter(x=>x>Date.now()).map(x=>x-Date.now()));if(!isFinite(w)||w>65e3)break;toast('Menunggu limit key pulih ('+Math.ceil(w/1e3)+' dtk)...');await sleep(w+500)}
 throw err}
function pj(t){t=t.replace(/```json|```/g,'').trim().replace(/(?<!\\)\\(?=(?:frac|times|theta|neq|ne|right|beta|bar|text|tan|tau|rho|nu|nabla|to)\b)/g,'\\\\').replace(/(?<!\\)\\(?!["\\\/bfnrtu])/g,'\\\\');const fx=x=>x.replace(/,\s*([\]}])/g,'$1');let v;try{v=JSON.parse(fx(t))}catch{const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<a)throw Error('JSON tidak valid');v=JSON.parse(fx(t.slice(a,b+1)))}
 if(!Array.isArray(v))v=Object.values(v).find(Array.isArray);if(!v)throw Error('JSON tanpa array');return v}
function norm0(q,s){if(!q||typeof q!='object')return null;const t=s.tipe,o={tipe:t,level:s.level,tp:q.tp||undefined,indikator:q.indikator||undefined,stimulus:q.stimulus||undefined,soal:String(q.soal||'').trim(),pembahasan:String(q.pembahasan||''),poin:+q.poin||(t=='uraian'?5:t=='pgk'?2:t=='jodoh'?4:1)};if(!o.soal)return null;
 if(t=='pg'||t=='pgk'){o.opsi=(q.opsi||[]).map(String);if(o.opsi.length<3)return null;const k=[].concat(q.kunci).map(Number).filter(i=>i>=0&&i<o.opsi.length);if(!k.length)return null;o.kunci=t=='pg'?k[0]:k}
 else if(t=='bs')o.kunci=q.kunci===true||/^(true|benar)$/i.test(String(q.kunci));
 else if(t=='jodoh'){o.opsi=(q.opsi||[]).filter(p=>p&&p.l&&p.r).map(p=>({l:String(p.l),r:String(p.r)}));if(o.opsi.length<2)return null;o.kunci=null}
 else{o.kunci=String(q.kunci??'');if(!o.kunci)return null}return o}
const mkPrompt=(c,sl,ci,n)=>`Anda ahli penyusun soal kurikulum Indonesia. Buat soal ${c.mapel} kelas ${c.kelas}, topik: ${c.topik}. Kesulitan: ${c.kes}. Ini bagian ${ci+1} dari ${n}; buat soal bervariasi dan tidak duplikat.${c.materi?'\nMateri acuan:\n'+c.materi.slice(0,6000):''}
Buat TEPAT ${sl.length} soal, urut sesuai daftar:
${sl.map((s,i)=>`${i+1}. tipe=${s.tipe} (${TP[s.tipe]}), level=${s.level} ${LV[s.level]}`).join('\n')}
Keluarkan HANYA JSON array ${sl.length} elemen. Elemen: {"tp":"tujuan pembelajaran (1 kalimat, diawali kata kerja operasional)","indikator":"indikator soal (1 kalimat)","stimulus":"opsional, wajib untuk C4-C6","soal":"...","opsi":[...],"kunci":...,"pembahasan":"...","poin":1}

async function gen(c){
 if(!ls('keys',[]).length)throw Error('Tambahkan API key Gemini di Pengaturan');
 const order=['bs','pg','pgk','jodoh','isian','uraian'],tl=[],ll=[];
 order.forEach(k=>Object.entries(c.tipe).forEach(([l,n])=>{if(l.endsWith('('+k+')'))for(let i=0;i<n;i++)tl.push(k)}));
 Object.keys(LV).forEach(k=>{for(let i=0;i<(c.lv[k]||0);i++)ll.push(k)});
 const slots=tl.map((t,i)=>({tipe:t,level:ll[i]})),chunks=[];for(let i=0;i<slots.length;i+=8)chunks.push(slots.slice(i,i+8));
 const out=new Array(slots.length),used=new Set();let done=0,last,next=0;
 const prog=()=>{const b=$('#g_btn');if(b)b.textContent=`Menghasilkan ${done}/${slots.length} soal...`};prog();
 const work=async ci=>{let miss=chunks[ci].map((s,i)=>i);
  for(let a=0;a<3&&miss.length;a++){try{const sl=miss.map(i=>chunks[ci][i]);const{txt,m}=await call(mkPrompt(c,sl,ci,chunks.length));used.add(m);const arr=pj(txt);
   miss=miss.filter((i,j)=>{const q=norm(arr[j],sl[j]);if(q){out[ci*8+i]=q;done++;prog();return false}return true})}
   catch(e){last=e;if(/Tidak ada API key/.test(e.message))break}}};
 const par=Math.min(chunks.length,Math.max(1,Math.min(4,usable().length)));
 await Promise.all(Array.from({length:par},async()=>{while(next<chunks.length)await work(next++)}));
 const qs=srt(out.filter(Boolean));if(!qs.length)throw last||Error('Gagal menghasilkan soal');
 if(qs.length<slots.length)toast(`${qs.length}/${slots.length} soal berhasil; sisanya gagal, coba generate ulang`);
 return{qs,m:[...used].join(', ')}}

const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','n':'ⁿ','+':'⁺','-':'⁻','(':'⁽',')':'⁾'},SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','(':'₍',')':'₎'};
const SYM={times:'×',div:'÷',cdot:'·',pm:'±',mp:'∓',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',ne:'≠',approx:'≈',pi:'π',theta:'θ',alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',lambda:'λ',mu:'μ',sigma:'σ',omega:'ω',Omega:'Ω',infty:'∞',degree:'°',circ:'°',angle:'∠',triangle:'△',perp:'⊥',parallel:'∥',rightarrow:'→',to:'→',leftarrow:'←',Rightarrow:'⇒',Leftrightarrow:'⇔',therefore:'∴',sum:'Σ',cup:'∪',cap:'∩',emptyset:'∅',ldots:'...',dots:'...',cdots:'...',left:'',right:'',quad:' ',qquad:' ',displaystyle:'',limits:''};
const sp=(s,m)=>[...s].every(c=>m[c])?[...s].map(c=>m[c]).join(''):null;
function clean(t){if(typeof t!='string')return t;let s=t;
 s=s.replace(/\\(?:text|mathrm|mathbf|mathit|textbf|operatorname)\s*\{([^{}]*)\}/g,'$1');
 for(let i=0;i<4;i++)s=s.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>/^\w+$/.test(a)&&/^\w+$/.test(b)?a+'/'+b:'('+a+')/('+b+')');
 s=s.replace(/\\sqrt\s*\[(\d+)\]\s*\{([^{}]*)\}/g,'akar pangkat $1 dari ($2)').replace(/\\sqrt\s*\{([^{}]*)\}/g,(m,a)=>/^\w+$/.test(a)?'√'+a:'√('+a+')');
 s=s.replace(/\^\{([^{}]*)\}|\^(-?\w)/g,(m,a,b)=>{const x=a??b;return sp(x,SUP)||'^('+x+')'});
 s=s.replace(/_\{([^{}]*)\}|(?<=\w)_(\d)/g,(m,a,b)=>{const x=a??b;return sp(x,SUB)||'_'+x});
 s=s.replace(/\\([A-Za-z]+)/g,(m,k)=>k in SYM?SYM[k]:k).replace(/\\([{}%])/g,'$1').replace(/\\\\|\\[()[\]]/g,' ').replace(/\\[,;: !]/g,' ').replace(/\\/g,'');
 s=s.replace(/&(amp|lt|gt|quot|nbsp|#\d+);/g,(m,k)=>({amp:' dan ',lt:'<',gt:'>',quot:'"',nbsp:' '}[k]||'')).replace(/\$+/g,'').replace(/<\/?[a-zA-Z][^>]*>/g,'');
 s=s.replace(/(\w|\))\s*\*\s*(?=\w|\()/g,'$1 × ').replace(/[*`~]/g,'').replace(/^\s*#+\s*/gm,'').replace(/__+(?=\S)/g,'').replace(/&/g,' dan ').replace(/\u00a0/g,' ').replace(/[ \t]{2,}/g,' ');
 return s.trim()}
const deep=v=>typeof v=='string'?clean(v):Array.isArray(v)?v.map(deep):v&&typeof v=='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,deep(x)])):v;
const norm=(q,s)=>{const o=norm0(q,s);return o?deep(o):o};

<aside class="rp"><div class="card" style="text-align:center"><div style="display:flex;justify-content:space-between"><button class="ib" title="Log" onclick="A.go('mon')">${ico('chart',17)}</button><button class="ib" title="Pengaturan" onclick="A.go('set')">${ico('gear',17)}</button></div><div class="pav">${av}</div><h2 style="font-size:20px;margin-top:8px">${E(who())}</h2><small style="color:var(--mu)">${E(sch.nama||'Lengkapi identitas di Pengaturan')}</small></div>
<div class="g3" style="margin-bottom:12px"><div class="st"><b>${S.sets.length}</b><small>Paket</small></div><div class="st"><b>${q.length}</b><small>Soal</small></div><div class="st"><b>${ms.length}</b><small>Mapel</small></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:var(--mu)">Sebaran Level</small><div style="font:600 22px Fraunces,serif">${q.length} soal</div></div><span class="tag" style="background:#FFF6D6;border-color:#F4E3A0">C1 - C6</span></div>${donut()}</div>
<div class="g2" style="gap:10px"><div class="card tl"><div class="ic" style="background:#FCD5CA;border-radius:50%">${ico('book',20)}</div><b>${q.length}</b><small>Bank Soal</small><button class="btn" onclick="A.go('bank')">Lihat semua</button></div><div class="card tl"><div class="ic" style="background:#E1DAFB;border-radius:50%">${ico('sparkles',20)}</div><b>${S.log.length}</b><small>Generate</small><button class="btn" onclick="A.go('mon')">Lihat semua</button></div></div></aside>`},
 gen:()=>`<h1>Generator Soal</h1><div class="card glass" style="margin-top:14px"><div class="grid">${f('g_judul','Judul paket','Ulangan Harian')}${f('g_mapel','Mata pelajaran','IPA')}${f('g_kelas','Kelas','7')}${f('g_topik','Topik / CP-TP','')}</div><label>Materi acuan (opsional, tempel teks)</label><textarea id="g_materi" rows="4"></textarea><label>Kesulitan</label><select id="g_kes"><option>Mudah</option><option selected>Sedang</option><option>Sulit (HOTS)</option></select>
<h3 style="margin-top:14px;font-size:16px">Jumlah per tipe soal</h3><div class="grid">${Object.keys(TP).map(k=>f('t_'+k,TP[k],k=='pg'?5:k=='uraian'?1:k=='isian'?1:k=='bs'?1:0,'number')).join('')}</div>
<h3 style="margin-top:14px;font-size:16px">Jumlah per level (kisi-kisi)</h3><div class="grid">${Object.keys(LV).map((k,i)=>f('l_'+k,k+' '+LV[k],[1,2,2,1,1,1][i],'number')).join('')}</div>
<p id="g_info" style="color:var(--mu);font-size:12px">Total jumlah tipe dan level sebaiknya sama.</p><button class="btn p" id="g_btn" onclick="A.run()">✦ Generate dengan Gemini</button></div>`,
 bank:()=>{const o=S.sets.find(s=>s.id==S.open);return`<h1>Bank Soal</h1><div style="margin-top:14px">${o?`<div class="card glass"><button class="btn" onclick="A.open(null)">← Kembali</button><h2 style="margin:10px 0">${E(o.judul)}</h2>${srt(o.questions).map(qHTML).join('')}</div>`:S.sets.map(card).join('')||'<div class="card">Belum ada paket.</div>'}</div>`},
 exp:()=>{const s=cur();if(!s)return'<h1>Ekspor</h1><div class="card">Belum ada paket.</div>';return`<h1>Ekspor</h1><div class="card glass" style="margin-top:14px"><label>Pilih paket</label><select onchange="A.sel(this.value,1)">${S.sets.map(x=>`<option value="${x.id}" ${x.id==s.id?'selected':''}>${E(x.judul)}</option>`).join('')}</select><div style="margin-top:12px"><button class="btn p" onclick="A.print()">🖨️ Cetak / PDF</button><button class="btn" onclick="A.word()">📄 Word</button><button class="btn" onclick="A.json()">{ } JSON</button><button class="btn p" onclick="A.gas()">📝 Google Form (Script Apps Script)</button></div><div id="gasbox"></div></div>`},
 set:()=>{const ks=ls('keys',[]),ms=ls('models',[]);return`<h1>Pengaturan</h1><div class="card glass" style="margin-top:14px"><h3>API Key Gemini <small style="font-size:12px;color:var(--mu)">(disimpan lokal di browser ini saja)</small></h3>${ks.map((k,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${E(k.l)} · ••••${E(k.v.slice(-4))} ${(x=>x.bad?'<b style="color:#c0392b">✗ tidak valid</b>':x.ok?'<b style="color:#1a7f5a">✓ aktif</b>':'')(kst()[kid(k)]||{})}</span><button class="btn" onclick="A.rmk(${i})">Hapus</button></div>`).join('')||'<p style="color:var(--mu)">Belum ada key.</p>'}<div class="grid">${f('k_l','Label','Key '+(ks.length+1))}${f('k_v','API Key','','password')}</div><button class="btn p" onclick="A.addk()">+ Tambah Key</button><button class="btn" onclick="A.models()">Uji Semua Key & Muat Model</button></div>
<div class="card glass"><h3>Model</h3><label>Model utama</label><select onchange="A.m('model',this.value)"><option value="auto" ${ls('model','auto')=='auto'?'selected':''}>Otomatis (pilih yang bisa dipakai)</option>${ms.map(m=>`<option ${m==ls('model','')?'selected':''}>${m}</option>`).join('')}</select><label>Model cadangan (fallback)</label><input value="${E(ls('fallback','gemini-flash-latest'))}" onchange="A.m('fallback',this.value)"></div>
<div class="card glass"><h3>Identitas Sekolah (Kop Surat)</h3>${(x=>`${ln(x,'pem','Instansi (baris 1)')}${ln(x,'dinas','Dinas / Yayasan (baris 2)')}${ln(x,'nama','Nama sekolah')}${ln(x,'npsn','NPSN')}${ln(x,'alamat','Alamat')}${ln(x,'kontak','Telp / Email / Web')}<div style="max-width:320px">${f('sc_kota','Kota (untuk tanda tangan)',x.kota||'')}</div><label>Logo sekolah (otomatis diperkecil)</label><input type="file" accept="image/*" onchange="A.logo(this)">${x.logo?`<div style="margin:8px 0"><img src="${x.logo}" style="height:60px;vertical-align:middle"> <button class="btn" onclick="A.rmlogo()">Hapus logo</button></div>`:''}<h3 style="margin-top:14px;font-size:16px">Guru dan Kepala Sekolah</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${f('sc_guru','Nama guru',x.guru||'')}${f('sc_nipg','NIP guru',x.nipg||'')}${f('sc_kepsek','Nama kepala sekolah',x.kepsek||'')}${f('sc_nipk','NIP kepala sekolah',x.nipk||'')}</div><button class="btn p" style="margin-top:10px" onclick="A.saveSchool()">Simpan Identitas</button>`)(sc())}</div>
`},
 tut:()=>`<h1>Tutorial</h1><div style="margin-top:14px">
<div class="card glass"><h2 style="font-size:20px">1. Mendapatkan API Key Gemini</h2><ol style="line-height:1.7"><li>Buka aistudio.google.com lalu login dengan akun Google.</li><li>Klik <b>Get API key</b> di menu kiri, lalu klik <b>Create API key</b>.</li><li>Pilih proyek yang ada atau buat proyek baru, lalu salin key yang muncul (biasanya diawali AIza).</li><li>Di SoalAI buka <b>Pengaturan</b>, isi Label dan API Key, lalu klik <b>Tambah Key</b>.</li><li>Untuk kuota lebih besar, ulangi langkah 1 sampai 4 dengan akun Google lain dan tambahkan key-nya juga.</li><li>Klik <b>Uji Semua Key dan Muat Model</b>. Key yang benar akan bertanda aktif, dan daftar model akan terisi.</li></ol><p style="color:var(--mu)">Catatan: key gratis punya batas permintaan per menit dan per hari. SoalAI otomatis berpindah ke key atau model lain saat batas tercapai. Jangan membagikan key kepada orang lain.</p></div>
<div class="card glass"><h2 style="font-size:20px">2. Google Form dengan Script Google Apps</h2><ol style="line-height:1.7"><li>Buka menu <b>Ekspor</b>, pilih paket soal, lalu klik <b>Script Apps Script</b>.</li><li>Klik tombol <b>Salin</b> untuk menyalin seluruh kodenya.</li><li>Buka script.google.com, klik <b>Proyek baru</b>, hapus kode bawaan, lalu tempel kode yang disalin.</li><li>Klik ikon simpan, pastikan fungsi yang dipilih di bagian atas adalah <b>buatForm</b>, lalu klik <b>Jalankan</b>.</li><li>Pertama kali, klik <b>Tinjau izin</b>, pilih akun Anda, lalu klik <b>Lanjutan</b> dan <b>Buka (tidak aman)</b> jika muncul peringatan. Ini normal untuk skrip buatan sendiri.</li><li>Setelah selesai, buka <b>Log eksekusi</b> di bagian bawah. Baris pertama berisi tautan edit Google Form Anda.</li><li>Soal isian singkat dan uraian dinilai manual. Kunci jawabannya ditampilkan di log eksekusi yang sama.</li></ol></div></div>`,
 mon:()=>`<h1>Log Generate</h1><div class="card glass" style="margin-top:14px;overflow:auto"><table><tr><th>Waktu</th><th>Paket</th><th>Model</th><th>Key</th><th>Status</th><th>ms</th><th>Error</th></tr>${S.log.map(l=>`<tr><td>${new Date(l.created_at).toLocaleTimeString()}</td><td>${E(l.set_title)}</td><td>${E(l.model)}</td><td>${E(l.key_label)}</td><td>${l.status}</td><td>${l.durasi_ms}</td><td>${E(l.error)}</td></tr>`).join('')||'<tr><td colspan="7">Belum ada log sesi ini.</td></tr>'}</table></div>`
};
function render(){const a=$('#app');a.className=S.user?'':'lgn';
 if(!S.user){a.innerHTML=`<div style="min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#DCEBA5,transparent 40%),radial-gradient(circle at 80% 80%,#F8DDF4,transparent 40%)"><div class="card glass" style="width:340px"><h1 style="font-size:32px">Soal<span style="color:var(--ac)">AI</span></h1><p style="color:var(--mu)">Login Admin${IS_PREVIEW?' (mode preview: isi bebas)':''}</p><input id="em" placeholder="Email" type="email"><br><br><input id="pw" type="password" placeholder="Password"><br><br><button class="btn p" style="width:100%" onclick="A.login()">Masuk</button></div></div>`;return}
 const mk=arr=>arr.map(([k,i,t])=>`<button class="nb ${S.page==k?'on':''}" title="${t}" onclick="A.go('${k}')">${ico(i)}</button>`).join('');
 const sch=sc(),av=sch.logo?`<img src="${sch.logo}">`:E((who()[0]||'G').toUpperCase());
 const logo=`<svg width="36" height="36" viewBox="0 0 34 34" fill="#F04A1F"><path d="M17 3c1.7 4.2 4.1 6.3 8.3 7.3-4.2 1-6.6 3.1-8.3 7.3-1.7-4.2-4.1-6.3-8.3-7.3C12.9 9.3 15.3 7.2 17 3z"/><path d="M25 18c1 2.6 2.6 4 5.2 4.8-2.6.8-4.2 2.200-5.200 4.800-1-2.600-2.600-4-5.200-4.800 2.600-.8 4.200-2.200 5.200-4.800z" opacity=".7"/></svg>`;
 a.innerHTML=`<div class="frame"><nav class="side">${logo}<button class="nb" title="Log" onclick="A.go('mon')">${ico('bell')}<i class="rd"></i></button><span style="height:10px"></span>${mk(N.filter(n=>n[0]!='set'&&n[0]!='mon'))}<span style="flex:1"></span>${mk(N.filter(n=>n[0]=='set'))}<button class="avt" title="Keluar" onclick="confirm('Keluar dari aplikasi?')&&A.out()">${av}</button></nav><nav class="bn glass">${mk(N)}</nav><div class="content">${S.page=='home'?P.home():'<div style="grid-column:1/-1;min-width:0">'+P[S.page]()+'</div>'}</div></div>`}

// ===== AKSI =====
const A={
 go(p){S.page=p;S.open=null;render()},
 fm(m){S.fm=m;render()},
 open(id){S.open=id;S.page='bank';render()},
 sel(id,stay){S.sel=id;stay?render():A.go('exp')},
 async del(id){if(confirm('Hapus paket ini?')){await DB.del(id);render()}},
 async login(){const e=$('#em').value,p=$('#pw').value;
  if(IS_PREVIEW)S.user={email:e||'admin@demo'};else{const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return toast(error.message);S.user=data.user}
  await enter();render()},
 async out(){if(!IS_PREVIEW)await sb.auth.signOut();S.user=null;render()},
 addk(){const l=$('#k_l').value.trim(),v=$('#k_v').value.trim();if(!v)return toast('Isi API key');const ks=ls('keys',[]);ks.push({l:l||'Key',v});sv('keys',ks);A.go('set')},
 rmk(i){const ks=ls('keys',[]);ks.splice(i,1);sv('keys',ks);A.go('set')},
 models:testKeys,m(k,v){sv(k,v)},
 async run(){
  if(S.busy)return;const g=id=>$('#'+id).value;
  const tipe={},lv={};Object.keys(TP).forEach(k=>{const n=+g('t_'+k);if(n>0)tipe[TP[k]+' ('+k+')']=n});Object.keys(LV).forEach(k=>{const n=+g('l_'+k);if(n>0)lv[k]=n});
  const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
  if(!sum(tipe))return toast('Isi jumlah soal');if(sum(tipe)!=sum(lv))return toast(`Total tipe (${sum(tipe)}) ≠ total level (${sum(lv)})`);
  const c={judul:g('g_judul'),mapel:g('g_mapel'),kelas:g('g_kelas'),topik:g('g_topik'),materi:g('g_materi'),kes:g('g_kes'),tipe,lv};
  S.busy=true;$('#g_btn').textContent='Menghasilkan soal...';$('#g_btn').classList.add('sk');
  try{const{qs,m}=await gen(c);
   const set=await DB.save({id:crypto.randomUUID(),judul:c.judul,mapel:c.mapel,kelas:c.kelas,topik:c.topik,model:m,config:{tipe,lv,kes:c.kes},created_at:new Date().toISOString(),questions:qs});
   if(!IS_PREVIEW)S.sets=await DB.sets();toast('Berhasil: '+qs.length+' soal');A.open(set.id)
  }catch(e){toast('Gagal: '+e.message);if($('#g_btn')){$('#g_btn').textContent='✦ Generate dengan Gemini';$('#g_btn').classList.remove('sk')}}
  S.busy=false},
 saveSchool(q){const x=sc();['pem','dinas','nama','npsn','alamat','kontak','kota','guru','nipg','kepsek','nipk'].forEach(k=>{const e=$('#sc_'+k);if(e)x[k]=e.value.trim()});x.fmt=x.fmt||{};['pem','dinas','nama','npsn','alamat','kontak'].forEach(k=>{const e=$('#sz_'+k);if(e)x.fmt[k]={s:+e.value,b:+$('#b_'+k).checked,i:+$('#i_'+k).checked,u:+$('#u_'+k).checked}});sv('school',x);if(!q)toast('Identitas sekolah tersimpan')},
 logo(inp){const f=inp.files[0];if(!f)return;A.saveSchool(1);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const x=sc();x.logo=c.toDataURL('image/png');sv('school',x);A.go('set')};im.onerror=()=>toast('File bukan gambar yang valid');im.src=r.result};r.readAsDataURL(f)},
 rmlogo(){A.saveSchool(1);const x=sc();delete x.logo;sv('school',x);A.go('set')},
 print(){const s=cur();const p=$('#pr')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'pr'}));p.innerHTML=docHTML(s);setTimeout(()=>print(),100)},
 word(){const s=cur();dl(s.judul+'.doc','\ufeff<html><head><meta charset="utf-8"></head><body>'+docHTML(s)+'</body></html>','application/msword')},
 json(){const s=cur();dl(s.judul+'.json',JSON.stringify(s,null,2),'application/json')},
 gas(){const s=cur();$('#gasbox').innerHTML=`<label>Salin ke script.google.com → Proyek baru → jalankan buatForm()</label><textarea id="gastx" rows="10" readonly>${E(gas(s))}</textarea><button class="btn p" onclick="$('#gastx').select();navigator.clipboard.writeText($('#gastx').value);">Salin</button>`}
};
window.A=A;window.$=$;window.sv_=(k,v)=>{sv(k,v);toast('Tersimpan')};
async function enter(){await autoSetupDatabase();S.sets=await DB.sets()}

// ===== PWA (Service Worker via Blob) =====
try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('fetch',()=>{})"],{type:'text/javascript'}))).catch(()=>{})}catch{}

if(!IS_PREVIEW){const{data}=await sb.auth.getSession();S.user=data.session?.user||null;if(S.user)await enter()}
// Atur password saat membuka tautan undangan/reset dari email Supabase
if(!IS_PREVIEW&&S.user&&/type=(invite|recovery)/.test(location.hash||'')){
 const ov=document.createElement('div');ov.id='pwset';ov.style.cssText='position:fixed;inset:0;background:rgba(20,20,30,.55);display:grid;place-items:center;z-index:999;padding:20px';
 ov.innerHTML=`<div class="card glass" style="width:340px;background:#fff"><h2 style="font-size:20px">Buat Password Login</h2><p style="color:var(--mu)">Selamat datang! Buat password untuk login SoalAI berikutnya.</p><input id="npw" type="password" placeholder="Password baru (min. 6 karakter)"><br><br><button class="btn p" style="width:100%" id="npwbtn">Simpan Password</button></div>`;
 document.body.appendChild(ov);
 $('#npwbtn').onclick=async()=>{const p=$('#npw').value;if(p.length<6)return toast('Password minimal 6 karakter');const{error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message);toast('Password tersimpan. Gunakan untuk login berikutnya.');ov.remove();history.replaceState(null,'',location.pathname+location.search)};
}
render();
</script></body></html>
